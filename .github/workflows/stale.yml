# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
  - cron: '29 7 * * *'

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v9
      with:
        days-before-issue-stale: 30
        days-before-issue-close: 14
        stale-issue-message: "This issue has been inactive for a while and will be marked as stale. Please reply if it's still relevant."
        close-issue-message: "Closing this issue due to inactivity. Feel free to comment if you'd like it reopened."
